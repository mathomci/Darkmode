<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Orçamentário · Matheus Homci</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0e1a;--card:rgba(255,255,255,.055);--border:rgba(255,255,255,.1);
  --txt:#fff;--txt2:#94a3b8;--blue:#38bdf8;--green:#4ade80;--red:#f87171;
  --purple:#a78bfa;--orange:#fb923c;--teal:#2dd4bf;--pink:#f472b6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;
  line-height:1.55;min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(600px 300px at 10% -5%,rgba(56,189,248,.13),transparent 60%),
    radial-gradient(600px 300px at 90% 0%,rgba(167,139,250,.13),transparent 60%),
    radial-gradient(500px 400px at 50% 110%,rgba(45,212,191,.08),transparent 60%);
}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
header{text-align:center;margin-bottom:22px}
header h1{
  font-size:26px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
header p{color:var(--txt2);font-size:13px;margin-top:4px}
.badge{
  display:inline-block;margin-top:10px;padding:5px 14px;border-radius:20px;
  background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);
  color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.toolbar{display:flex;justify-content:center;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn{
  background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--txt);
  padding:8px 16px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:.25s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.btn:hover{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.4);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.meta{color:var(--txt2);font-size:11px}
.glass{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:26px}
.chip{padding:14px 16px;border-radius:14px;transition:.25s}
.chip .lbl{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.chip .val{font-size:20px;font-weight:800;margin-top:4px}
.chip .sub{font-size:10px;color:var(--txt2);margin-top:2px}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.nav-card{
  position:relative;text-align:left;color:var(--txt);font-family:inherit;
  padding:24px;border-radius:18px;cursor:pointer;transition:.25s;overflow:hidden;
  background:var(--card);border:1px solid var(--border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.nav-card:hover{transform:translateY(-4px);border-color:rgba(56,189,248,.45);box-shadow:0 14px 40px rgba(56,189,248,.15)}
.nav-icon{
  width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:24px;margin-bottom:16px;
}
.nav-card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.nav-card p{font-size:12px;color:var(--txt2);line-height:1.5}
.nav-arrow{position:absolute;top:20px;right:20px;color:var(--txt2);font-size:18px;transition:.25s}
.nav-card:hover .nav-arrow{color:var(--blue);transform:translateX(3px)}
.sec-title{font-size:17px;font-weight:700;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{padding:20px}
.kpi .lbl{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.kpi .val{font-size:24px;font-weight:800;margin-top:8px}
.kpi .sub{font-size:11px;color:var(--txt2);margin-top:4px;line-height:1.5}
.prog{width:100%;height:10px;background:rgba(255,255,255,.09);border-radius:6px;overflow:hidden;margin:14px 0}
.prog-fill{height:100%;border-radius:6px;transition:width .8s ease}
.tbl-wrap{width:100%;overflow-x:auto;border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:560px}
th{
  text-align:left;padding:12px 14px;background:rgba(255,255,255,.05);
  color:var(--txt2);font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap;
}
td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.hl{background:rgba(167,139,250,.08);font-weight:700}
.tag{padding:3px 9px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.t-green{background:rgba(74,222,128,.15);color:var(--green)}
.t-red{background:rgba(248,113,113,.15);color:var(--red)}
.t-blue{background:rgba(56,189,248,.15);color:var(--blue)}
.t-orange{background:rgba(251,146,60,.15);color:var(--orange)}
.t-grey{background:rgba(148,163,184,.15);color:var(--txt2)}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cc{padding:22px;position:relative;overflow:hidden}
.cc::before{
  content:'';position:absolute;inset:0;opacity:.14;pointer-events:none;
  background:linear-gradient(135deg,var(--cc1,#38bdf8),var(--cc2,#a78bfa));
}
.cc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative}
.cc .name{font-weight:800;font-size:14px}
.cc .fatura{font-size:24px;font-weight:800;margin:4px 0 2px;position:relative}
.cc .venc{font-size:11px;color:var(--txt2);position:relative}
.cc .lim{display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);position:relative;margin-top:8px}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:13px;color:var(--txt2)}
.breadcrumb button{
  background:none;border:none;color:var(--blue);font-family:inherit;font-size:13px;
  font-weight:600;cursor:pointer;padding:4px 8px;border-radius:8px;display:flex;align-items:center;gap:6px;
}
.breadcrumb button:hover{background:rgba(56,189,248,.12)}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.liq{padding:22px;margin-top:16px}
.liq .row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px;font-size:14px}
.chart-box{padding:22px;margin-top:16px}
.form-card{max-width:560px;margin:0 auto;padding:28px}
.form-card .field{margin-bottom:18px}
.form-card label{display:block;font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:7px}
.form-card input,.form-card select{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--txt);font-family:inherit;font-size:14px;
  transition:.25s;-webkit-appearance:none;appearance:none;
}
.form-card input:focus,.form-card select:focus{outline:none;border-color:rgba(56,189,248,.6);background:rgba(56,189,248,.06)}
.form-card input[type=date]{color-scheme:dark}
.form-card select option{background:#0a0e1a;color:var(--txt)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-card .btn{width:100%;margin-top:6px;padding:13px;font-size:14px}
#status{margin-top:14px;text-align:center;font-size:13px;font-weight:600;min-height:20px}
#status.ok{color:var(--green)}
#status.err{color:var(--red)}
#cancelStatus{margin-top:14px;text-align:center;font-size:13px;font-weight:600;min-height:20px}
#cancelStatus.ok{color:var(--green)}
#cancelStatus.err{color:var(--red)}
#invStatus{margin-top:14px;text-align:center;font-size:13px;font-weight:600;min-height:20px}
#invStatus.ok{color:var(--green)}
#invStatus.err{color:var(--red)}
#antStatus{margin-top:14px;text-align:center;font-size:13px;font-weight:600;min-height:20px}
#antStatus.ok{color:var(--green)}
#antStatus.err{color:var(--red)}
#transStatus{margin-top:14px;text-align:center;font-size:13px;font-weight:600;min-height:20px}
#transStatus.ok{color:var(--green)}
#transStatus.err{color:var(--red)}
footer{text-align:center;color:var(--txt2);font-size:11px;margin-top:44px;padding-top:18px;border-top:1px solid var(--border)}
@media(max-width:640px){
  .wrap{padding:18px 14px 48px}
  header h1{font-size:21px}
  .nav-grid{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:20px}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Controle Orçamentário</h1>
    <p>Matheus Homci · Dashboard pessoal · Dados da planilha</p>
    <span class="badge">Cenário: Out/2026 em diante</span>
    <div class="toolbar">
      <button class="btn" onclick="loadAll()">↻ Atualizar dados</button>
      <span class="meta" id="meta">Carregando…</span>
    </div>
  </header>
  <div class="chips" id="chips"></div>
  <!-- ============ VIEW: HOME (HUB) ============ -->
  <section class="view active" id="view-home">
    <div class="nav-grid">
      <button class="nav-card" onclick="go('lancamento')">
        <span class="nav-arrow">→</span>
        <div class="nav-icon" style="background:linear-gradient(135deg,rgba(74,222,128,.25),rgba(74,222,128,.05))">➕</div>
        <h3>Novo Lançamento</h3>
        <p>Registre entrada/saída e transfira entre contas.</p>
      </button>
      <button class="nav-card" onclick="go('cancelar')">
        <span class="nav-arrow">→</span>
        <div class="nav-icon" style="background:linear-gradient(135deg,rgba(248,113,113,.25),rgba(248,113,113,.05))">🗑️</div>
        <h3>Cancelar Lançamento</h3>
        <p>Remova um lançamento registrado e reverta seus efeitos.</p>
      </button>
      <button class="nav-card" onclick="go('overview')">
        <span class="nav-arrow">→</span>
        <div class="nav-icon" style="background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(56,189,248,.05))">📊</div>
        <h3>Visão Geral</h3>
        <p>KPIs, saldo por conta, liquidez e projeção mensal.</p>
      </button>
      <button class="nav-card" onclick="go('credit')">
        <span class="nav-arrow">→</span>
        <div class="nav-icon" style="background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(167,139,250,.05))">💳</div>
        <h3>Gestão de Crédito</h3>
        <p>Limites, pagamento, desfazer, repasses e antecipação.</p>
      </button>
      <button class="nav-card" onclick="go('faturas')">
        <span class="nav-arrow">→</span>
        <div class="nav-icon" style="background:linear-gradient(135deg,rgba(74,222,128,.25),rgba(74,222,128,.05))">🧾</div>
        <h3>Faturas</h3>
        <p>Detalhamento completo de cada fatura do mês.</p>
      </button>
      <button class="nav-card" onclick="go('cronograma')">
        <span class="nav-arrow">→</span>
        <div class="nav-icon" style="background:linear-gradient(135deg,rgba(251,146,60,.25),rgba(251,146,60,.05))">📅</div>
        <h3>Cronograma</h3>
        <p>Parcelamentos por cartão e obrigações mês a mês.</p>
      </button>
      <button class="nav-card" onclick="go('invest')">
        <span class="nav-arrow">→</span>
        <div class="nav-icon" style="background:linear-gradient(135deg,rgba(45,212,191,.25),rgba(45,212,191,.05))">📈</div>
        <h3>Investimentos</h3>
        <p>Reservas acumuladas, aportes e resgates.</p>
      </button>
      <button class="nav-card" onclick="go('extrato')">
        <span class="nav-arrow">→</span>
        <div class="nav-icon" style="background:linear-gradient(135deg,rgba(248,113,113,.25),rgba(248,113,113,.05))">📋</div>
        <h3>Extrato</h3>
        <p>Entradas e saídas registradas no período.</p>
      </button>
    </div>
    <footer>Dados lidos direto do Google Sheets · Atualize a página ou clique em "Atualizar dados"</footer>
  </section>
  <!-- ============ VIEW: NOVO LANÇAMENTO ============ -->
  <section class="view" id="view-lancamento">
    <div class="breadcrumb"><button onclick="go('home')">← Início</button><span>/</span><span>Novo Lançamento</span></div>
    <div class="glass form-card">
      <h3 class="sec-title" style="margin-top:0">Registrar lançamento<span class="line"></span></h3>
      <form id="formLancamento">
        <div class="field">
          <label>Data</label>
          <input type="date" id="data">
        </div>
        <div class="field">
          <label>Categoria / Origem</label>
          <select id="categoria" onchange="toggleConta()" required>
            <option value="">Selecione…</option>
            <option value="PIX">PIX (Conta Corrente)</option>
            <option value="Bradesco">Cartão Bradesco</option>
            <option value="Inter">Cartão Inter</option>
            <option value="Mercado Pago">Cartão Mercado Pago</option>
            <option value="Nubank">Cartão Nubank</option>
            <option value="Riachuelo">Cartão Riachuelo</option>
          </select>
        </div>
        <div class="field" id="contaField" style="display:none">
          <label>Conta (PIX)</label>
          <select id="conta">
            <option value="Bradesco">Bradesco</option>
            <option value="Inter">Inter</option>
            <option value="Mercado Pago">Mercado Pago</option>
            <option value="Nubank">Nubank</option>
            <option value="Midway">Midway</option>
          </select>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Valor (R$)</label>
            <input type="number" id="valor" step="0.01" min="0" placeholder="0,00" required>
          </div>
          <div class="field">
            <label>Tipo</label>
            <select id="tipo">
              <option value="saida">Saída</option>
              <option value="entrada">Entrada</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Parcelado?</label>
          <select id="parcelado" onchange="toggleParcelamento()">
            <option value="nao">À vista</option>
            <option value="sim">Parcelado</option>
          </select>
        </div>
        <div class="form-row" id="parcelaFields" style="display:none">
          <div class="field">
            <label>Nº de parcelas</label>
            <input type="number" id="parcelas" min="1" max="24" value="1">
          </div>
          <div class="field">
            <label>Parcela atual</label>
            <input type="number" id="parcelaAtual" min="1" max="24" value="1">
          </div>
        </div>
        <div class="field">
          <label>Descrição</label>
          <input type="text" id="descricao" placeholder="Ex.: Pissolati Café, mercado, salário…" required>
        </div>
        <button type="submit" class="btn" id="btnSalvar">Salvar lançamento</button>
      </form>
      <p id="status"></p>
    </div>
    <h3 class="sec-title">Transferir entre contas<span class="line"></span></h3>
    <div class="glass form-card">
      <div class="form-row">
        <div class="field">
          <label>Origem</label>
          <select id="transOrigem">
            <option value="Bradesco">Bradesco</option>
            <option value="Inter">Inter</option>
            <option value="Mercado Pago">Mercado Pago</option>
            <option value="Nubank">Nubank</option>
            <option value="Midway">Midway</option>
          </select>
        </div>
        <div class="field">
          <label>Destino</label>
          <select id="transDestino">
            <option value="Midway">Midway</option>
            <option value="Bradesco">Bradesco</option>
            <option value="Inter">Inter</option>
            <option value="Mercado Pago">Mercado Pago</option>
            <option value="Nubank">Nubank</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Valor (R$)</label>
          <input type="number" id="transValor" step="0.01" min="0" placeholder="0,00">
        </div>
        <div class="field">
          <label>Data</label>
          <input type="date" id="transData">
        </div>
      </div>
      <button class="btn" onclick="transferirContas()">⇄ Transferir</button>
      <p id="transStatus"></p>
    </div>
  </section>
  <!-- ============ VIEW: CANCELAR LANÇAMENTO ============ -->
  <section class="view" id="view-cancelar">
    <div class="breadcrumb"><button onclick="go('home')">← Início</button><span>/</span><span>Cancelar Lançamento</span></div>
    <div class="glass tbl-wrap"><table id="lancTable"></table></div>
    <p id="cancelStatus"></p>
  </section>
  <!-- ============ VIEW: VISÃO GERAL
